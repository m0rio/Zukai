<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap">
<style>html,body{margin:0;background:#eeeeee}svg{display:block}</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"
  aria-label="振込の構成図。利用者がアプリを使い、アプリが銀行のシステムの振込APIを呼ぶ。振込APIは不正検知と勘定系につながり、外部の通知へ非同期で送る。"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/gh/m0rio/Zukai@main/zukai.js"></script>
<script>
const z = Zukai.create(document.getElementById('s'), { width: 1200, height: 520 }), C = z.C;
z.heading(60, 56, '振込APIが、検知と記帳をつなぐ');
const Y = 264;

// 範囲
z.box(430, 110, 560, 370, '銀行のシステム', { role: 'scope' });

// つながり（実線は同期、破線は非同期）
z.arrow([[160, Y], [244, Y]]);
z.arrow([[316, Y], [474, Y]]);
z.elbow([[560, Y - 42], [560, 182], [754, 182]]);
z.elbow([[560, Y + 42], [560, 375], [769, 375]]);
z.arrow([[646, Y], [1024, Y]], { strokeLineDash: [9, 7] });

// 役割ごとの形
z.person(110, 300, { s: 0.9, side: true }); z.T(110, 326, '利用者', { anchor: 'middle' });
z.phone(280, 304);                          z.T(280, 328, 'アプリ', { anchor: 'middle' });
z.box(480, Y - 36, 160, 72, '振込API', { role: 'main' });
z.box(760, 150, 170, 64, '不正検知');
z.cylinder(775, 330, 140, 90, '勘定系');
z.box(1030, Y - 36, 130, 72, '通知', { role: 'ext' });
</script>
</body>
</html>
