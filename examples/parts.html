<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap">
<style>html,body{margin:0;background:#eeeeee}svg{display:block}</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="880" role="img" aria-label="Zukai の部品の見本。人、ロボット、箱、作業キュー、書類の山、机とモニタ、検査ゲート、設計ボード、書類、チェックリスト、鍵、虫眼鏡、照明、棒グラフ、見出し、札、矢印、コンベア。"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/gh/m0rio/Zukai@main/zukai.js"></script>
<script>
const z = Zukai.create(document.getElementById('s'), { width: 1200, height: 880 });
const cx = [110, 306, 502, 698, 894, 1090];
const name = (x, y, s) => z.T(x, y, s, { size: 15, anchor: 'middle', fill: z.C.grey });
z.heading(40, 44, 'Zukai の部品');

let b = 220;
cx.forEach(x => z.ground(x - 70, x + 70, b));
z.person(cx[0], b); name(cx[0], b + 26, 'person');
z.person(cx[1], b, { side: true }); name(cx[1], b + 26, 'person { side }');
z.person(cx[2], b, { sweat: true, paper: true }); name(cx[2], b + 26, 'person { sweat, paper }');
z.robot(cx[3], b); name(cx[3], b + 26, 'robot');
z.robot(cx[4], b, { off: true }); name(cx[4], b + 26, 'robot { off }');
z.crate(cx[5], b); name(cx[5], b + 26, 'crate');

b = 440;
[0, 1, 3, 4, 5].forEach(i => z.ground(cx[i] - 70, cx[i] + 70, b));
z.queue(cx[0] - 23, b, 4); name(cx[0], b + 26, 'queue');
z.stack(cx[1] - 56, b, 5, { label: 'PR', labelAt: [1] }); name(cx[1], b + 26, 'stack');
z.desk(cx[2] - 80, cx[2] + 80, b - 58); z.monitor(cx[2] - 45, b - 150, 90, 68, b - 58); name(cx[2], b + 26, 'desk / monitor');
z.gate(cx[3], b, { h: 84 }); name(cx[3], b + 26, 'gate');
z.board(cx[4] - 65, b - 96, 130, 84); name(cx[4], b + 26, 'board');
z.doc(cx[5] - 32, b - 92, 64, 84); name(cx[5], b + 26, 'doc');

b = 670;
[0, 1, 2, 3, 4, 5].forEach(i => z.ground(cx[i] - 70, cx[i] + 70, b));
z.clipboard(cx[0] - 34, b - 96, 68, 88); name(cx[0], b + 26, 'clipboard');
z.lock(cx[1], b - 8, { s: 1.7 }); name(cx[1], b + 26, 'lock');
z.magnifier(cx[2] - 10, b - 52, { s: 1.4 }); name(cx[2], b + 26, 'magnifier');
z.lamp(cx[3], b - 170, { on: true, floor: b, spread: 62 }); name(cx[3], b + 26, 'lamp { on }');
z.lamp(cx[4], b - 170); name(cx[4], b + 26, 'lamp');
z.bars(cx[5] - 55, b, [30, 60, 96], { main: 2, labels: ['0', '1', '2'] }); name(cx[5], b + 26, 'bars');

z.heading(54, 780, 'heading'); name(110, 836, 'heading');
z.sign(306, 780, '型検査'); name(306, 836, 'sign');
z.arrow([[440, 792], [500, 770], [564, 788]]); name(502, 836, 'arrow');
z.conveyor(660, 1150, 790); z.crate(730, 790); z.crate(830, 790); z.robot(940, 790, { s: 0.8 }); name(905, 836, 'conveyor');
</script>
</body>
</html>
