<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap">
<style>html,body{margin:0;background:#eeeeee}svg{display:block}</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img"
  aria-label="いままでは人が一行ずつ書いて読み、PRが山積みになる。これからはエージェントが書き、人は工程と基準を持つ。"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/gh/m0rio/Zukai@main/zukai.js"></script>
<script>
const z = Zukai.create(document.getElementById('s'), { width: 1200, height: 630 }), C = z.C;

// ── いままで ──
z.heading(62, 76, 'いままで');
const G1 = 480;
z.stack(392, G1, 14, { label: 'PR', labelAt: [0, 7] });
z.desk(76, 372, G1);
z.monitor(214, 350, 136, 100, G1);
z.person(138, G1, { sweat: true });
z.T(322, 172, '3万件/日', { size: 25, fill: C.navy });
z.arrow([[392, 190], [408, 196], [414, 210]], { stroke: C.navy, strokeWidth: 2.5, head: 9 });
z.T(288, 604, '一行ずつ書いて、一行ずつ読む', { size: 21, anchor: 'middle' });

// ── 近代化 ──
z.heading(598, 300, '近代化', { size: 20, anchor: 'middle', fill: C.navy });
z.arrow([[552, 344], [600, 334], [646, 348]], { stroke: C.navy, strokeWidth: 4.5, head: 17 });

// ── これから ──
z.heading(692, 76, 'これから');
z.person(748, 248, { s: 0.92 });
z.board(790, 150, 150, 96);
z.T(968, 184, 'ラインと基準を', { size: 17 });
z.T(968, 210, '設計する', { size: 17 });

const G2 = 448;
z.conveyor(690, 1158, G2);
z.queue(704, G2, 4);
z.robot(812, G2); z.robot(876, G2);
z.crate(926, G2);
z.gate(984, G2);
z.crate(984, G2);
z.crate(1042, G2);
z.person(1112, G2, { s: 0.92, paper: true });
const ly = 496;
z.T(728, ly, '作業キュー', { size: 17, anchor: 'middle' });
z.T(844, ly, 'エージェント', { size: 17, anchor: 'middle' });
z.T(984, ly, '検査', { size: 17, anchor: 'middle' });
z.T(1108, ly, '判断と責任', { size: 17, anchor: 'middle' });
z.arrow([[984, 514], [972, 544], [912, 552], [856, 544], [844, 516]], { stroke: C.navy, strokeWidth: 2.5, head: 11 });
z.T(912, 570, '差し戻し', { size: 16, anchor: 'middle', fill: C.navy });
z.T(922, 604, '書くのはエージェント、人は工程と基準を持つ', { size: 21, anchor: 'middle' });
</script>
</body>
</html>
