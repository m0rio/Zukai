<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap">
<style>html,body{margin:0;background:#eeeeee}svg{display:block}</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img" aria-label="構成図の例。利用者がアプリを使い、アプリがAPIを呼び、APIがDBに保存し、外部決済へ非同期で通知する。"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/gh/m0rio/Zukai@main/zukai.js"></script>
<script>
const z = Zukai.create(document.getElementById('s'), { width: 1200, height: 500 });
z.heading(60, 52, '役割ごとに形と色を決める');
z.box(300, 100, 520, 350, '社内システム', { role: 'scope' });
z.person(150, 290, { s: 0.9, side: true }); z.T(150, 316, '利用者', { anchor: 'middle' });
z.box(350, 200, 160, 80, 'アプリ');
z.box(600, 200, 160, 80, 'API', { role: 'main' });
z.cylinder(620, 340, 120, 88, 'DB');
z.box(980, 200, 160, 80, '外部決済', { role: 'ext' });
z.arrow([[196, 240], [344, 240]]);
z.arrow([[516, 240], [594, 240]]);
z.arrow([[680, 286], [680, 334]]);
z.arrow([[766, 240], [974, 240]], { strokeLineDash: [9, 7] });
z.T(870, 218, '通知する', { size: 15, anchor: 'middle', halo: z.C.surface });
</script>
</body>
</html>
