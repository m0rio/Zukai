<body>
<!-- 単体画像は 1200×630 前後、スライドは 1920×1080。aria-label に「何がどうなっている図か」を1文で書く -->
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img" aria-label=""></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/gh/m0rio/Zukai@main/zukai.js"></script>
<script>
const z = Zukai.create(document.getElementById('s'), { width: 1200, height: 630 }), C = z.C;
const G = 480; // 足元の線。人と物は同じ線に立たせる

// 見出しに結論を書く
z.heading(62, 76, '結論を1文で書く');
// 地面 → 小道具 → 人 → 持ち物 → 文字 の順に描く
z.ground(80, 1120, G);
z.person(200, G);
z.T(200, G + 28, '名前', { size: 17, anchor: 'middle' });
</script>
